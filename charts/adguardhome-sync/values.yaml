# Default values for adguardhome-sync.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/bakito/adguardhome-sync
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# adguardhome-sync serves its API/web UI on this port (API_PORT env var below).
# Set env's API_PORT to 0 to disable the API, but note this also disables the
# liveness/readiness probes below since there is nothing left to poll.
service:
  type: ClusterIP
  port: 8080
  name: http
  # protocol: TCP

ingress:
  enabled: false
  className: ''
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: adguardhome-sync.*
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# if using Traefik
ingressRoute:
  enabled: false
  annotations: {}
    # external-dns.alpha.kubernetes.io/target: traefik.example.com
    # kubernetes.io/ingress.class: traefik
  entryPoints: []
    # - web
    # - websecure
  routes:
    - match: "PathPrefix (`/`)"
      # services: []

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# A tcpSocket check is used instead of httpGet because every request to
# "/" or "/healthz" makes a live call to the origin/replica instances -
# an unreachable/slow AdGuardHome instance would otherwise fail the probes.
livenessProbe:
  tcpSocket:
    port: http
readinessProbe:
  tcpSocket:
    port: http

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# adguardhome-sync is configured entirely via environment variables (or a
# config file you mount yourself via volumes/volumeMounts above).
# See https://github.com/bakito/adguardhome-sync for the full list of options.
env:
  - name: ORIGIN_URL
    value: https://192.168.1.2:3000
  - name: ORIGIN_USERNAME
    value: admin
  - name: ORIGIN_PASSWORD
    valueFrom:
      secretKeyRef:
        key: origin-password
        name: adguardhome-sync-secret
        optional: true
  # Add one block per replica, incrementing the index (REPLICA1_*, REPLICA2_*, ...)
  - name: REPLICA1_URL
    value: http://192.168.1.3
  - name: REPLICA1_USERNAME
    value: admin
  - name: REPLICA1_PASSWORD
    valueFrom:
      secretKeyRef:
        key: replica1-password
        name: adguardhome-sync-secret
        optional: true
  # Standard cron expression; defaults to running once and exiting if unset.
  - name: CRON
    value: '0 */2 * * *'
  - name: RUN_ON_START
    value: 'true'
  # By default the process exits if a sync fails (e.g. a replica is briefly
  # unreachable), which crash-loops the pod. Keep syncing on error instead.
  - name: CONTINUE_ON_ERROR
    value: 'true'
  # Without a client timeout, a sync against an unreachable/unresponsive
  # origin or replica blocks indefinitely, which also blocks the /healthz
  # and / endpoints and trips the liveness/readiness probes below.
  - name: HTTP_CLIENT_TIMEOUT
    value: '10s'
  # Optional, defaults to 8080. Set to 0 to disable the API entirely.
  # - name: API_PORT
  #   value: '8080'

envFrom:
  - secretRef:
      name: adguardhome-sync-secrets
      optional: true

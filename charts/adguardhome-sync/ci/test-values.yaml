env:
  - name: ORIGIN_URL
    value: http://192.168.1.2:3000
  - name: ORIGIN_USERNAME
    value: username
  - name: ORIGIN_PASSWORD
    value: password
  - name: REPLICA1_URL
    value: http://192.168.1.3
  - name: REPLICA1_USERNAME
    value: username
  - name: REPLICA1_PASSWORD
    value: password
  # Origin/replicas above aren't reachable in CI; skip the startup sync so the
  # pod doesn't exit(2) and crash-loop before the readiness probe can pass.
  - name: RUN_ON_START
    value: 'false'
  - name: CONTINUE_ON_ERROR
    value: 'true'

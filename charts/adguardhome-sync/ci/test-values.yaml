env:
  - name: ORIGIN_URL
    value: http://192.168.1.2:3000
  - name: ORIGIN_USERNAME
    value: username
  - name: ORIGIN_PASSWORD
    value: password
  - name: REPLICA1_URL
    value: http://192.168.1.3
  - name: REPLICA1_USERNAME
    value: username
  - name: REPLICA1_PASSWORD
    value: password
  # Origin/replicas above aren't reachable in CI. Keep syncing on error
  # (rather than exiting) and fail fast so the startup sync doesn't block
  # the readiness/liveness probes long enough to trip them.
  - name: CONTINUE_ON_ERROR
    value: 'true'
  - name: HTTP_CLIENT_TIMEOUT
    value: '3s'

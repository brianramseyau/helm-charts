apiVersion: v1
kind: Service
metadata:
  name: {{ include "adguardhome-sync.fullname" . }}
  labels:
    {{- include "adguardhome-sync.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.name }}
      protocol: {{ .Values.service.protocol | default "TCP" }}
      name: {{ .Values.service.name }}
  selector:
    {{- include "adguardhome-sync.selectorLabels" . | nindent 4 }}

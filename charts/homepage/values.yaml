replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  pullPolicy: IfNotPresent
  tag: ''

imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''
  token:
    create: true

clusterRole:
  create: true
  name: ''

clusterRoleBinding:
  create: true
  name: ''

podAnnotations: {}

podLabels: {}

podSecurityContext: {}
# podSecurityContext:
#   fsGroup: 2000

securityContext: {}
# securityContext:
#   capabilities:
#     drop:
#     - ALL
#   readOnlyRootFilesystem: true
#   runAsNonRoot: true
#   runAsUser: 1000

service:
  create: true
  type: ClusterIP
  port: 3000
  annotations: {}

ingress:
  enabled: false
  className: ''
  annotations:
    gethomepage.dev/description: Dynamically Detected Homepage
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: homepage.png
    gethomepage.dev/name: Homepage
  hosts:
    - host: gethomepage.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - gethomepage.dev

resources: {}
# resources:
#   limits:
#     cpu: 100m
#     memory: 128Mi
#   requests:
#     cpu: 100m
#     memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []

volumeMounts: []

# this is used to set the allowed hosts for the homepage a value of `*` will disable the check (not recommended)
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: gethomepage.dev

envFrom: []
# envFrom:
#   - secretRef:
#       name: my-secret
#   - configMapRef:
#       name: my-configmap

nodeSelector: {}

tolerations: []

affinity: {}

# You may write all config in yaml, and reference other values if needed with {{ .Values.<value> }}
# blank values will cause the key associated key to be ignored in rendering
config:
  docker.yaml: ''

  kubernetes.yaml:
    mode: cluster

  settings.yaml: {}

  bookmarks.yaml:
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/

  services.yaml:
    - My First Group:
        - My First Service:
            href: http://localhost/
            description: Homepage is awesome
    - My Second Group:
        - My Second Service:
            href: http://localhost/
            description: Homepage is the best
    - My Third Group:
        - My Third Service:
            href: http://localhost/
            description: Homepage is 😎

  widgets.yaml:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: 'cluster'
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank

  custom.css: ''
  # custom.css: |
  #   body {
  #     background-color: {{ .Values;
  #   }
  #   .homepage-header {
  #     background-color: #333;
  #     color: white;
  #   }
  #   .homepage-footer {
  #     background-color: #333;
  #     color: white;
  #   }

  custom.js: ''
  # custom.js: |
  #   // Custom JavaScript code
  #   document.addEventListener('DOMContentLoaded', function() {
  #     console.log('Custom JavaScript loaded');
  #   });

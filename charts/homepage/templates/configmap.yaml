apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homepage.fullname" . }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if $value }}
  {{- if contains ".yaml" $key }}
  {{- $key | nindent 2 }}: |
    {{- tpl (toYaml $value) $ | nindent 4 }}
  {{- else }}
  {{- $key | nindent 2 }}: |
    {{- tpl (toString $value) $ | trim | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- end }}

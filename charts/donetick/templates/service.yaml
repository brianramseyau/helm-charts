apiVersion: v1
kind: Service
metadata:
  name: {{ include "donetick.fullname" . }}
  namespace: {{ include "donetick.namespace" . }}
  labels:
    {{- include "donetick.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "donetick.selectorLabels" . | nindent 4 }}
{{- if .Values.statefulset.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "donetick.fullname" . }}-headless
  namespace: {{ include "donetick.namespace" . }}
  labels:
    {{- include "donetick.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "donetick.selectorLabels" . | nindent 4 }}
{{- end }}

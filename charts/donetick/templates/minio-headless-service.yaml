{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "donetick.minio.fullname" . }}
  namespace: {{ include "donetick.namespace" . }}
spec:
  clusterIP: None
  ports:
    - name: api
      port: {{ .Values.minio.service.apiPort }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
{{- end }}
